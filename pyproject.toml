[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "auralert"
version = "0.1.0"
description = "AURALERT — Voice-first scam defense tool for Alexa+"
readme = "README.md"
authors = [
    { name = "Ujjwal" }
]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.3.0",
    "fastapi>=0.115.0",
    "starlette>=0.40.0",
    "uvicorn>=0.30.0",
    "boto3>=1.35.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "build", "*.egg-info"]

[tool.ruff.lint]
# Explicit so results do not depend on ruff's default rule set (which changes between versions)
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff.lint.per-file-ignores]
# conftest must set DB_PATH before importing the app modules
"tests/conftest.py" = ["E402"]
