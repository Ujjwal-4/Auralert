# Render blueprint: New + > Blueprint, point at this repo. Fill secret values in the Render dashboard.
services:
  - type: web
    name: scamshield
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: "8000"
      - key: DB_PATH
        value: /app/data/scamshield.db
      - key: ALLOWED_ORIGINS
        sync: false          # set to https://<your-service>.onrender.com
      - key: ALLOWED_HOSTS
        sync: false          # set to <your-service>.onrender.com
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: anthropic.claude-3-haiku-20240307-v1:0
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
